<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConsentZero</title>
  <link rel="stylesheet" href="ui-base.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon48.png" alt="ConsentZero">
      <div>
        <div class="brand-title">ConsentZero</div>
        <div class="brand-sub" id="siteHost">100% local · zero telemetry</div>
      </div>
    </div>
    <button class="tier-pill" id="tierPill">FREE</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="shield">Shield</button>
    <button class="tab-btn" data-tab="log">Audit Log</button>
    <button class="tab-btn" data-tab="rules">Rules</button>
    <button class="tab-btn" data-tab="pro">Pro</button>
  </nav>

  <main>
    <section class="panel active" id="panel-shield">
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-val" id="rejectedCount">0</div>
          <div class="stat-lbl">Cookies Rejected</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="hiddenCount">0</div>
          <div class="stat-lbl">Banners Hidden</div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:700;">Auto-Reject Cookie Banners</div>
            <div class="muted">Prefers "Reject All" over blind acceptance</div>
          </div>
          <label class="switch"><input type="checkbox" id="enabledToggle"><span class="slider"></span></label>
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn btn-sm btn-block" id="pauseSiteBtn">Pause on Current Site</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Default Action Policy</div>
        <select id="policySelect">
          <option value="reject">Reject Non-Essential Cookies (Recommended)</option>
          <option value="hide">Hide Banner Visually Only</option>
        </select>
        <div class="row" style="margin-top:9px;">
          <span>Declutter newsletter popups <span class="pro-tag">PRO</span></span>
          <label class="switch"><input type="checkbox" id="declutterToggle"><span class="slider"></span></label>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-log">
      <div class="card">
        <div class="row">
          <div class="card-title" style="margin:0;">Transparent Per-Site Actions</div>
          <button class="btn btn-sm" id="clearLogBtn">Clear</button>
        </div>
      </div>
      <div class="list" id="auditList" style="max-height:320px;"></div>
    </section>

    <section class="panel" id="panel-rules">
      <div class="card">
        <div class="card-title">Custom CSS / Button Selector <span class="pro-tag">PRO</span></div>
        <div class="row">
          <input type="text" id="customSelInput" placeholder="e.g. #my-cookie-decline-btn">
          <button class="btn btn-primary btn-sm" id="addSelBtn">Add</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Paused Sites & Custom Rules</div>
        <div class="list" id="rulesList"></div>
      </div>
    </section>

    <section class="panel" id="panel-pro"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
